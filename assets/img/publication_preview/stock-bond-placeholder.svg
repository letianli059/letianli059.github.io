<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Stock-bond publication preview placeholder</title>
  <desc id="desc">Temporary preview image to be replaced by the author.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#201a0e" />
      <stop offset="1" stop-color="#644812" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" rx="36" fill="url(#bg)" />
  <rect x="72" y="72" width="656" height="12" rx="6" fill="#f6c453" />
  <text x="400" y="285" fill="#ffffff" font-family="Arial, sans-serif" font-size="82" font-weight="700" text-anchor="middle">STOCK–BOND</text>
  <text x="400" y="375" fill="#f1dfb6" font-family="Arial, sans-serif" font-size="32" text-anchor="middle">preview image forthcoming</text>
</svg>
